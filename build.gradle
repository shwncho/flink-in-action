plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'practice-flink'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    flinkVersion = '2.1.2'
}

configurations.all {
    resolutionStrategy.capabilitiesResolution.withCapability('org.lz4:lz4-java') {
        select('at.yawk.lz4:lz4-java:0')
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.kafka:spring-kafka'

    implementation "org.apache.flink:flink-streaming-java:${flinkVersion}"
    implementation "org.apache.flink:flink-clients:${flinkVersion}"
    implementation "org.apache.flink:flink-runtime-web:${flinkVersion}"
    implementation "org.apache.flink:flink-connector-base:${flinkVersion}"
    implementation "org.apache.flink:flink-connector-kafka:4.0.1-2.0"
    implementation "org.apache.flink:flink-statebackend-rocksdb:${flinkVersion}"

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "org.apache.flink:flink-test-utils:${flinkVersion}"
    testImplementation "org.apache.flink:flink-streaming-java:${flinkVersion}:tests"
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

application {
    mainClass = 'com.example.demo.PracticeFlinkApplication'
}

tasks.register('runFlinkJob', JavaExec) {
    group = 'application'
    description = 'Run the Flink Kafka consumer job'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.demo.flink.FlinkKafkaJob'
}

tasks.named('test') {
    useJUnitPlatform()
}
